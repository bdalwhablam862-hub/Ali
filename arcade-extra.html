<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#100b1d"><title>ألعاب علي جيمز</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#100b1d;color:#fff;font-family:system-ui,Tahoma,Arial}header{padding:18px 16px;background:#171027;border-bottom:1px solid #382653;position:sticky;top:0;z-index:2}h1{margin:0;font-size:25px}header p{margin:5px 0 0;color:#b8a9ca}.wrap{max-width:900px;margin:auto;padding:16px}.games{display:grid;grid-template-columns:repeat(auto-fit,minmax(145px,1fr));gap:12px}.tile{background:#2b1d43;border:1px solid #493267;border-radius:17px;padding:15px;color:white;text-align:right;cursor:pointer;min-height:130px}.tile:active{transform:scale(.98)}.ico{font-size:36px;display:block;margin-bottom:8px}.tile b{font-size:17px}.tile small{display:block;color:#b9a9ca;margin-top:5px}.panel{margin-top:16px;padding:16px;border-radius:18px;background:#241735;border:1px solid #493267}.panel h2{margin:0 0 8px}.muted{color:#b9a9ca}.btn{border:0;border-radius:12px;padding:12px 18px;background:#ffdf4d;color:#21162c;font-weight:800;font-size:16px;cursor:pointer;min-height:46px}.btn.alt{background:#382653;color:#fff;border:1px solid #594078}.row{display:flex;gap:9px;flex-wrap:wrap;margin-top:12px}.playarea{margin-top:14px;min-height:230px;background:#130e20;border:1px solid #493267;border-radius:15px;padding:14px;display:grid;place-items:center;text-align:center}.target{font-size:70px;cursor:pointer;user-select:none}.big{font-size:46px}.score{font-size:20px;font-weight:800;color:#ffdf4d}.choices{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:10px}.choice{font-size:30px;background:#382653;border:1px solid #594078;border-radius:12px;padding:10px;min-width:60px;cursor:pointer}.bar{height:12px;background:#493267;border-radius:20px;overflow:hidden;margin:10px 0}.bar i{display:block;height:100%;background:#ffdf4d;width:0%}input{font:inherit;padding:10px;border-radius:10px;border:1px solid #594078;background:#130e20;color:white;max-width:100%}a{color:#ffdf4d}@media(max-width:380px){.wrap{padding:11px}.tile{padding:12px}}
</style></head><body><header><h1>🎮 ألعاب إضافية</h1><p>ألعاب صغيرة أصلية مستوحاة من أنواع الألعاب في الصورة</p></header><main class="wrap"><div class="games" id="games">
<button class="tile" data-game="archery"><span class="ico">🏹</span><b>رماة السهام</b><small>صوّب على الهدف واجمع النقاط</small></button>
<button class="tile" data-game="penalty"><span class="ico">⚽</span><b>ضربات الجزاء</b><small>اختار زاوية التسديد وسجّل</small></button>
<button class="tile" data-game="freekick"><span class="ico">🥅</span><b>الضربة الحرة</b><small>حاول تتخطى الحائط وتسجل</small></button>
<button class="tile" data-game="bakery"><span class="ico">🧁</span><b>مخبز الدمج</b><small>ادمج الحلوى المتشابهة</small></button>
<button class="tile" data-game="words"><span class="ico">🔤</span><b>عالم الكلمات</b><small>كوّن كلمة من الحروف</small></button>
<button class="tile" data-game="clash"><span class="ico">🥊</span><b>مواجهة الأبطال</b><small>توقيت الضربات والدفاع</small></button>
<button class="tile" data-game="football"><span class="ico">🏟️</span><b>تحدي الكرة</b><small>راوغ واجمع الكرات</small></button>
</div><section class="panel" id="panel"><h2 id="title">اختار لعبة وابدأ التحدي</h2><p class="muted" id="desc">كل لعبة تشتغل مباشرة من المتصفح.</p><div class="playarea" id="area"><div><div class="big">🕹️</div><p>اضغط على واحدة من الألعاب بالأعلى</p></div></div><div class="row"><button class="btn alt" id="back" type="button">قائمة الألعاب</button><button class="btn" id="restart" type="button">إعادة اللعبة</button></div><p class="score" id="score" aria-live="polite">النقاط: 0</p></section><p class="muted"><a href="index.html">← الرجوع إلى ALI GAMES</a></p></main>
<script>
(()=>{const $=id=>document.getElementById(id);let game='',score=0,turn=0,word='';const words=['كرة','هدف','ملعب','نجم','فريق','حارس'];function points(n=1){score+=n;$('score').textContent='النقاط: '+score}
function start(g){game=g;score=0;turn=0;$('score').textContent='النقاط: 0';$('games').style.display='none';const names={archery:['رماة السهام','اضغط على الهدف المتحرك لتحصل على نقطة.'],penalty:['ضربات الجزاء','اختار مكان التسديد. الحارس يختار زاوية عشوائية!'],freekick:['الضربة الحرة','اختار ارتفاع وقوة التسديدة لتتجاوز الحائط.'],bakery:['مخبز الدمج','اضغط على قطعتين متشابهتين لدمجهما وتسجيل النقاط.'],words:['عالم الكلمات','رتّب الحروف لتكوين كلمة عربية.'],clash:['مواجهة الأبطال','اضغط هجوم عندما تظهر إشارة الهجوم، ودافع عندما يهاجم الخصم.'],football:['تحدي الكرة','اضغط على الكرة كلما ظهرت في مكان جديد واجمع النقاط.']};$('title').textContent=names[g][0];$('desc').textContent=names[g][1];render()}
function render(){const a=$('area');if(game==='archery'){a.innerHTML='<div><div class="muted">الهدف</div><button class="target" id="target">🎯</button><p>السهام المصيبة: '+score+'</p></div>';$('target').onclick=()=>{points();$('target').style.transform='translate('+((Math.random()*50)-25)+'px,'+((Math.random()*30)-15)+'px)';$('target').textContent=['🎯','🏹','🎯'][Math.floor(Math.random()*3)]}}
else if(game==='penalty'||game==='freekick'){a.innerHTML='<div><div class="big">🥅</div><p>'+(game==='penalty'?'اختار زاوية التسديد':'اختار طريقة التسديد')+'</p><div class="choices">'+(game==='penalty'?['⬅️','⬆️','➡️']:['منخفضة','متوسطة','عالية']).map((x,i)=>'<button class="choice" data-i="'+i+'">'+x+'</button>').join('')+'</div><p id="result">جاهز للتسديد؟</p></div>';a.querySelectorAll('[data-i]').forEach(b=>b.onclick=()=>{let save=Math.random()<.38; $('result').textContent=save?'🧤 الحارس صدّها!':'⚽ جوووول!';if(!save)points(2);turn++})}
else if(game==='bakery'){let vals=['🍓','🍩','🧁','🍓','🍩','🧁','🍪','🍪','🍰'];a.innerHTML='<div><p>اختار قطعتين متشابهتين</p><div class="choices">'+vals.map((v,i)=>'<button class="choice" data-i="'+i+'">'+v+'</button>').join('')+'</div><p id="result">كل دمج صحيح = 3 نقاط</p></div>';let picked=[];a.querySelectorAll('[data-i]').forEach(b=>b.onclick=()=>{if(b.disabled)return;b.disabled=true;picked.push(b);if(picked.length===2){if(picked[0].textContent===picked[1].textContent){points(3);$('result').textContent='دمج ممتاز!';picked.forEach(x=>x.textContent='✨')}else{$('result').textContent='مش متشابهين، جرّب تاني';picked.forEach(x=>x.disabled=false)}picked=[]}})}
else if(game==='words'){word=words[Math.floor(Math.random()*words.length)];let chars=word.split('').sort(()=>Math.random()-.5);a.innerHTML='<div><div class="big">🔤</div><p>كوّن كلمة من الحروف دي:</p><div class="choices">'+chars.map((c,i)=>'<button class="choice" data-c="'+c+'">'+c+'</button>').join('')+'</div><p><input id="answer" placeholder="اكتب الكلمة هنا"><button class="btn" id="check">تحقق</button></p><p id="result"></p></div>';$('check').onclick=()=>{if($('answer').value.trim()===word){$('result').textContent='إجابة صحيحة!';points(5)}else $('result').textContent='حاول مرة أخرى'}}
else if(game==='clash'){let attack=Math.random()>.5;a.innerHTML='<div><div class="big">🥊</div><h2>'+(attack?'⚡ فرصتك للهجوم!':'🛡️ الخصم يهاجم، دافع!')+'</h2><button class="btn" id="move">'+(attack?'اضرب':'دافع')+'</button><p id="result">التوقيت مهم!</p></div>';$('move').onclick=()=>{let ok=Math.random()>.35;$('result').textContent=ok?'حركة ناجحة!':'فاتتك الحركة!';if(ok)points(2);setTimeout(render,800)}}
else if(game==='football'){a.innerHTML='<div><div class="big">🏟️</div><p>اضغط الكرة بسرعة قبل ما تختفي</p><button class="target" id="ball">⚽</button><p id="result">محاولاتك: '+turn+'</p></div>';$('ball').onclick=()=>{points();turn++;$('result').textContent='إصابة ممتازة!';$('ball').style.transform='translate('+(Math.random()*60-30)+'px,'+(Math.random()*30-15)+'px)';if(turn%5===0)$('ball').textContent='🏆'}}
}
$('games').querySelectorAll('[data-game]').forEach(b=>b.addEventListener('click',()=>start(b.dataset.game)));$('back').onclick=()=>{$('games').style.display='grid';game='';$('title').textContent='اختار لعبة وابدأ التحدي';$('desc').textContent='كل لعبة تشتغل مباشرة من المتصفح.';$('area').innerHTML='<div><div class="big">🕹️</div><p>اضغط على واحدة من الألعاب بالأعلى</p></div>';score=0;$('score').textContent='النقاط: 0'};$('restart').onclick=()=>{if(game)start(game)};
})();
</script></body></html>
