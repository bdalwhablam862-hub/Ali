<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>ALI GAMES 3D ARCADE</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#080d18;color:#f4f7ff;font-family:system-ui,Tahoma,sans-serif}main{max-width:1100px;margin:auto;padding:14px}.top{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}.top h1{margin:4px 0;color:#f7d66a}.top a,.btn{border:1px solid #44536b;background:#1b2940;color:#fff;border-radius:12px;padding:11px 15px;text-decoration:none;font-weight:800;cursor:pointer}.layout{display:grid;grid-template-columns:260px 1fr;gap:14px;margin-top:12px}.panel{background:linear-gradient(145deg,#18263c,#101827);border:1px solid #34445d;border-radius:18px;padding:13px}.games{display:grid;gap:7px}.games button{display:flex;align-items:center;gap:10px;text-align:right;background:#202f48;color:#fff;border:1px solid #3b4d69;border-radius:11px;padding:10px;font:inherit;font-weight:700;cursor:pointer}.games button.active{border-color:#f7d66a;background:#38445a}.games i{font-style:normal;font-size:25px}.stage h2{margin:0 0 5px}.muted{color:#aebbd0;font-size:14px}.view{position:relative;overflow:hidden;border-radius:16px;background:radial-gradient(ellipse at 50% 35%,#243e5c,#080f1b 72%);min-height:430px;border:1px solid #3b4d69}.view canvas{display:block;width:100%;height:430px;touch-action:none}.hud{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;margin:10px 0}.chip{background:#0d1728;border:1px solid #364b69;padding:8px 12px;border-radius:99px}.controls{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-top:10px}.controls button{min-width:48px;min-height:46px}.hint{min-height:24px;color:#f7d66a;text-align:center;margin:8px}.mobile-pad{display:flex;gap:10px;justify-content:center;margin-top:8px}.mobile-pad button{font-size:22px;min-width:66px;min-height:52px}@media(max-width:720px){main{padding:8px}.layout{grid-template-columns:1fr}.games{grid-template-columns:repeat(2,minmax(0,1fr))}.games button{font-size:13px;padding:8px}.view,.view canvas{min-height:370px;height:370px}}
</style></head><body><main><header class="top"><div><h1>⚡ ALI GAMES — 3D WORLD</h1><div class="muted">10 ألعاب ثلاثية الأبعاد • العب باللمس أو لوحة المفاتيح</div></div><a href="./">الرئيسية</a></header>
<div class="layout"><aside class="panel"><h3>🎮 اختر لعبتك</h3><div class="games" id="games"></div></aside><section class="panel stage"><h2 id="title">سباق السيارات 3D</h2><div class="muted" id="desc">تفادى السيارات واجمع العملات.</div><div class="hud"><span class="chip" id="score">النقاط: 0</span><span class="chip" id="level">المستوى: 1</span><span class="chip" id="lives">المحاولات: 3</span></div><div class="view" id="view"><div style="padding:35px;text-align:center">جارٍ تحميل عالم 3D…</div></div><div class="hint" id="hint" aria-live="polite">استخدم الأزرار أو الأسهم للتحكم.</div><div class="mobile-pad"><button class="btn" id="left">◀</button><button class="btn" id="action">العب / اقفز</button><button class="btn" id="right">▶</button></div><div class="controls"><button class="btn" id="restart">↻ إعادة اللعبة</button><button class="btn" id="pause">Ⅱ إيقاف</button></div></section></div></main>
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';
const $=id=>document.getElementById(id);
const games=[
['race','🏎️','سباق السيارات','تفادى السيارات واجمع العملات.'],
['zombie','🧟','الهروب من الزومبي','تحرك وواجه الزومبي قبل أن يصلوا إليك.'],
['penalty','⚽','ضربات الجزاء','اختار زاوية التسديد وسجّل في المرمى.'],
['basket','🏀','كرة السلة','صوّب الكرة نحو السلة واجمع النقاط.'],
['brick','🧱','كسر الطوب 3D','حرّك المضرب وارتد بالكرة لتدمير المكعبات.'],
['snake','🐍','الثعبان 3D','اجمع الطعام ولا تصطدم بنفسك.'],
['xo','⭕','XO ثلاثية الأبعاد','نافس الكمبيوتر على لوحة ثلاثية الأبعاد.'],
['mines','💣','كاسحة الألغام 3D','افتح الخانات وتجنب الألغام.'],
['castle','🏰','الدفاع عن القلعة','امنع موجات الأعداء من الوصول للقلعة.'],
['gold','🪙','جامع الذهب','اجمع العملات وتجنب الفخاخ.']];
let scene,camera,renderer,clock,root,objects=[],mode='race',score=0,lives=3,level=1,paused=false,ended=false,raf=0,keys={},player,ball,targets=[],tick=0,turn=0,grid=[],snake=[],dir={x:1,z:0},food,boardGroup;
const mats={road:new THREE.MeshStandardMaterial({color:0x252f40,roughness:.9}),gold:new THREE.MeshStandardMaterial({color:0xffd34e,metalness:.75,roughness:.22}),red:new THREE.MeshStandardMaterial({color:0xef5267,metalness:.25,roughness:.35}),blue:new THREE.MeshStandardMaterial({color:0x42b9ef,metalness:.35,roughness:.25}),green:new THREE.MeshStandardMaterial({color:0x45d18b,roughness:.4}),white:new THREE.MeshStandardMaterial({color:0xf4f5f8,roughness:.3}),dark:new THREE.MeshStandardMaterial({color:0x18243a,roughness:.8}),wood:new THREE.MeshStandardMaterial({color:0x80522e,roughness:.8})};
function box(w,h,d,mat,x,y,z,group=scene){let m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mat);m.position.set(x,y,z);m.castShadow=true;m.receiveShadow=true;group.add(m);return m}
function sphere(r,mat,x,y,z,group=scene){let m=new THREE.Mesh(new THREE.SphereGeometry(r,24,18),mat);m.position.set(x,y,z);m.castShadow=true;group.add(m);return m}
function cylinder(rt,rb,h,mat,x,y,z,group=scene){let m=new THREE.Mesh(new THREE.CylinderGeometry(rt,rb,h,24),mat);m.position.set(x,y,z);m.castShadow=true;group.add(m);return m}
function text3DLabel(){ }
function base(){scene=new THREE.Scene();scene.background=new THREE.Color(0x0a1322);scene.fog=new THREE.Fog(0x0a1322,18,42);camera=new THREE.PerspectiveCamera(48,1,.1,100);camera.position.set(0,8,13);camera.lookAt(0,0,0);renderer=new THREE.WebGLRenderer({antialias:true,alpha:false});renderer.setPixelRatio(Math.min(devicePixelRatio,1.8));renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.15;$('view').replaceChildren(renderer.domElement);scene.add(new THREE.HemisphereLight(0xbddcff,0x293044,2));let light=new THREE.DirectionalLight(0xffe6bd,3.2);light.position.set(-5,10,7);light.castShadow=true;scene.add(light);root=new THREE.Group();scene.add(root);clock=new THREE.Clock();resize();window.onresize=resize;}
function resize(){if(!renderer)return;let w=$('view').clientWidth,h=$('view').clientHeight;camera.aspect=w/h;camera.updateProjectionMatrix();renderer.setSize(w,h,false)}
function floor(color=0x1b684b){box(24,.3,24,new THREE.MeshStandardMaterial({color,roughness:.95}),0,-.25,0);let gridHelper=new THREE.GridHelper(24,24,0x7aa58b,0x315d4b);gridHelper.position.y=-.08;scene.add(gridHelper)}
function car(x,z,color=0x35b9ef){let g=new THREE.Group();box(1.15,.45,2,new THREE.MeshStandardMaterial({color,metalness:.55,roughness:.25}),0,.55,0,g);box(.82,.48,.85,new THREE.MeshStandardMaterial({color:0x9bd8f0,metalness:.4,roughness:.15}),0,.98,-.1,g);[-.55,.55].forEach(a=>[-.62,.65].forEach(b=>cylinder(.24,.24,.18,mats.dark,a,.28,b,g).rotation.z=Math.PI/2));g.position.set(x,0,z);root.add(g);return g}
function human(x,z,mat=mats.red){let g=new THREE.Group();cylinder(.22,.28,.85,mat,0,.72,0,g);sphere(.23,new THREE.MeshStandardMaterial({color:0xd9a47d}),0,1.35,0,g);box(.65,.18,.2,mat,0,.85,0,g);g.position.set(x,0,z);root.add(g);return g}
function clear(){cancelAnimationFrame(raf);if(renderer){renderer.dispose();renderer=null}objects=[];targets=[];keys={};tick=0;turn=0;score=0;lives=3;level=1;paused=false;ended=false;updateHud();base()}
function updateHud(){$('score').textContent='النقاط: '+score;$('level').textContent='المستوى: '+level;$('lives').textContent='المحاولات: '+lives}
function say(t){$('hint').textContent=t}
function end(msg){ended=true;say(msg+' — اضغط إعادة اللعبة للمحاولة من جديد.')}
function spawnRace(){floor(0x343c49);box(7,.1,22,mats.road,0,-.03,0);for(let z=-10;z<11;z+=3)box(.12,.03,1.2,mats.gold,0,.04,z);player=car(0,7);for(let i=0;i<6;i++){let o=car([-2,0,2][i%3],-10-i*4,[0xef5267,0xf0a33c,0x9569e8][i%3]);o.userData={z:o.position.z};targets.push(o)}camera.position.set(0,7,13);camera.lookAt(0,0,-2)}
function spawnZombie(){floor(0x344b3d);player=human(0,7,mats.blue);for(let i=0;i<7;i++){let z=human((Math.random()-.5)*9,-7-Math.random()*12);targets.push(z)}camera.position.set(0,9,14);camera.lookAt(0,0,0)}
function goal(){floor(0x276b3c);box(10,3,.3,mats.white,0,1.5,-9);box(.2,3,.4,mats.white,-5,1.5,-9);box(.2,3,.4,mats.white,5,1.5,-9);for(let x=-4.5;x<=4.5;x+=1.5)box(.08,2.8,.08,mats.white,x,1.5,-9);player=car(0,6,0xeeeeee);ball=sphere(.35,mats.white,0,.45,2);targets=[box(1.3,2,.25,mats.red,-1.7,1,-8.7),box(1.3,2,.25,mats.red,1.7,1,-8.7)];camera.position.set(0,7,13);camera.lookAt(0,1,-2)}
function spawnBasket(){floor(0x704a31);box(7,4,.3,mats.wood,0,2,-8);box(2.2,.18,.18,mats.white,0,3,-7.7);cylinder(.85,.85,.12,mats.red,0,2.65,-7.6).rotation.x=Math.PI/2;box(.15,2,.15,mats.wood,0,1.5,-7.8);ball=sphere(.42,new THREE.MeshStandardMaterial({color:0xf18b35}),0,.45,5);camera.position.set(0,8,14);camera.lookAt(0,1,-2)}
function spawnBrick(){floor(0x29384c);for(let r=0;r<4;r++)for(let c=0;c<7;c++){let b=box(1.25,.5,.55,[mats.red,mats.gold,mats.green,mats.blue][r],(c-3)*1.45,4.2-r*.62,-6);targets.push(b)}player=box(2.6,.35,.65,mats.white,0,.4,6);ball=sphere(.28,mats.gold,0,1,4);camera.position.set(0,9,15);camera.lookAt(0,2,-1)}
function spawnSnake(){floor(0x214f43);let baseX=-4.5,baseZ=-4.5;for(let i=0;i<10;i++)for(let j=0;j<10;j++)box(.88,.08,.88,new THREE.MeshStandardMaterial({color:(i+j)%2?0x397b60:0x2c684f}),baseX+i,0,baseZ+j);snake=[{x:4,z:5},{x:3,z:5},{x:2,z:5}];dir={x:1,z:0};drawSnake();camera.position.set(0,12,10);camera.lookAt(0,0,0)}
function drawSnake(){if(boardGroup)root.remove(boardGroup);boardGroup=new THREE.Group();root.add(boardGroup);snake.forEach((p,i)=>box(.72,.45,.72,i?mats.green:mats.gold,p.x-4.5,.32,p.z-4.5,boardGroup));if(food)root.remove(food);food=sphere(.27,mats.red,Math.floor(Math.random()*10)-4.5,.35,Math.floor(Math.random()*10)-4.5);root.add(food)}
function spawnXO(){floor(0x34415a);for(let x=-1;x<=1;x++)for(let z=-1;z<=1;z++){let tile=box(2,.22,2,new THREE.MeshStandardMaterial({color:0x8b9cb4,metalness:.3,roughness:.3}),x*2.1,.15,z*2.1);tile.userData={cell:[x+1,z+1],used:false};targets.push(tile)}camera.position.set(5,10,12);camera.lookAt(0,0,0);say('اضغط على مربع للعب X، والكمبيوتر يلعب O.')}
function spawnMines(){floor(0x34415a);grid=Array.from({length:5},()=>Array(5).fill(0));let n=0;while(n<5){let x=Math.floor(Math.random()*5),z=Math.floor(Math.random()*5);if(!grid[z][x]){grid[z][x]=-1;n++}}for(let z=0;z<5;z++)for(let x=0;x<5;x++){let t=box(1.25,.3,1.25,mats.blue,(x-2)*1.4,.2,(z-2)*1.4);t.userData={x,z,open:false};targets.push(t)}camera.position.set(0,9,10);camera.lookAt(0,0,0)}
function spawnCastle(){floor(0x394b37);for(let i=0;i<4;i++){box(.8,3,.8,mats.wood,(i-1.5)*2,1.4,-7);cylinder(.15,.15,.4,mats.gold,(i-1.5)*2,3.1,-7)}box(5,2,1,mats.wood,0,1,-8);player=box(2,.8,.8,mats.blue,0,.5,5);for(let i=0;i<5;i++)targets.push(human((Math.random()-.5)*8,-10-i*3));camera.position.set(0,10,15);camera.lookAt(0,1,-1)}
function spawnGold(){floor(0x5a4a32);player=human(0,0,mats.blue);for(let i=0;i<15;i++){let coin=cylinder(.35,.35,.12,mats.gold,(Math.random()-.5)*9,.7,(Math.random()-.5)*16);coin.rotation.x=Math.PI/2;targets.push(coin)}for(let i=0;i<8;i++)targets.push(box(1,.6,1,mats.red,(Math.random()-.5)*9,.3,(Math.random()-.5)*16));camera.position.set(0,9,13);camera.lookAt(0,0,0)}
function build(){clear();let g=games.find(a=>a[0]===mode);$('title').textContent=g[2]+' 3D';$('desc').textContent=g[3];if(mode==='race')spawnRace();if(mode==='zombie')spawnZombie();if(mode==='penalty')goal();if(mode==='basket')spawnBasket();if(mode==='brick')spawnBrick();if(mode==='snake')spawnSnake();if(mode==='xo')spawnXO();if(mode==='mines')spawnMines();if(mode==='castle')spawnCastle();if(mode==='gold')spawnGold();say('ابدأ اللعب! استخدم الأسهم أو أزرار التحكم.');animate()}
function move(dx){if(ended||paused)return;if(mode==='race'||mode==='zombie'||mode==='gold'||mode==='castle'){if(player)player.position.x=Math.max(-4,Math.min(4,player.position.x+dx*1.15))}else if(mode==='brick'&&player)player.position.x=Math.max(-5,Math.min(5,player.position.x+dx*1.3));else if(mode==='snake'){dir=dx<0?{x:-1,z:0}:{x:1,z:0}}}
function action(){if(ended||paused)return;
if(mode==='penalty'){let x=(Math.random()-.5)*7;ball.position.set(x,.5,-7);score+=Math.random()>.28?10:0;say(score?'جوووول! تسديدة رائعة ⚽':'الحارس تصدى للكرة!');}
else if(mode==='basket'){ball.position.set((Math.random()-.5)*1.2,2.7,-7.3);score+=Math.random()>.3?2:0;say('تصويبة! '+(score?'نقطتان':'حاول مرة أخرى'))}
else if(mode==='xo'){let tile=targets.find(t=>!t.userData.used);if(tile){tile.userData.used=true;tile.material=mats.gold;tile.scale.y=2;let cpu=targets.find(t=>!t.userData.used);if(cpu){cpu.userData.used=true;cpu.material=mats.red;cpu.scale.y=2}score+=1;say('نقلة جيدة! دورك مرة أخرى قريبًا.')}} 
else if(mode==='mines'){let tile=targets.find(t=>!t.userData.open);if(tile){tile.userData.open=true;let {x,z}=tile.userData;if(grid[z][x]===-1){tile.material=mats.red;lives--;say('انفجر لغم!');}else{tile.material=mats.green;score+=5;say('آمن! +5 نقاط')}if(lives<=0)end('انتهت المحاولات')}} 
else if(mode==='brick'){ball.position.set(player.position.x,.7,4);score+=5;targets=targets.filter(t=>{if(Math.abs(t.position.x-player.position.x)<1.1){root.remove(t);return false}return true});say('ضربة!')}
else if(mode==='zombie'){let z=targets.shift();if(z){root.remove(z);score+=10;say('تخلصت من زومبي! +10')}} 
else if(mode==='snake'){let head={x:snake[0].x+dir.x,z:snake[0].z+dir.z};snake.unshift(head);if(head.x<0||head.x>9||head.z<0||head.z>9||snake.slice(1).some(p=>p.x===head.x&&p.z===head.z)){end('اصطدمت!');return}snake.pop();score+=1;drawSnake()}
else if(mode==='gold'){let t=targets.shift();if(t){root.remove(t);score+=10;say('جمعت عملة ذهبية!')}}
else if(mode==='castle'){let z=targets.shift();if(z){root.remove(z);score+=10;say('صدّيت المهاجم!')}}updateHud()}
function animate(){raf=requestAnimationFrame(animate);let dt=Math.min(clock.getDelta(),.04);if(!paused&&!ended){tick+=dt;if(mode==='race'){targets.forEach(t=>{t.position.z+=dt*7;if(t.position.z>10){t.position.z=-22;score++;updateHud()}if(Math.abs(t.position.z-player.position.z)<1.4&&Math.abs(t.position.x-player.position.x)<1){lives--;t.position.z=-24;updateHud();if(!lives)end('اصطدمت بالسيارات')}})}
if(mode==='zombie'||mode==='castle'){targets.forEach(t=>{let v=mode==='zombie'?.7:.45;t.position.z+=dt*v;if(t.position.z>player.position.z-1){lives--;t.position.z=-18;updateHud();if(!lives)end('وصل الأعداء إليك')}})}
if(mode==='gold'){targets.forEach(t=>{t.rotation.y+=dt*2})}
if(mode==='penalty'&&ball)ball.rotation.x+=dt*3;if(mode==='basket'&&ball)ball.rotation.x+=dt*2;
if(mode==='brick'&&ball){ball.position.x+=Math.sin(tick*2)*dt*3;ball.position.z-=dt*4;if(ball.position.z<-7){ball.position.z=4;ball.position.x=player.position.x;score+=1;updateHud()}}
if(mode==='snake'&&tick>.45){tick=0;let h={x:snake[0].x+dir.x,z:snake[0].z+dir.z};snake.unshift(h);if(h.x<0||h.x>9||h.z<0||h.z>9||snake.slice(1).some(p=>p.x===h.x&&p.z===h.z)){end('انتهت اللعبة!');}else{snake.pop();drawSnake()}}
}renderer.render(scene,camera)}
function select(id){mode=id;document.querySelectorAll('#games button').forEach(b=>b.classList.toggle('active',b.dataset.id===id));build()}
games.forEach(g=>{let b=document.createElement('button');b.dataset.id=g[0];b.innerHTML='<i>'+g[1]+'</i><span>'+g[2]+'</span>';b.addEventListener('click',()=>select(g[0]));$('games').appendChild(b)});
$('left').addEventListener('click',()=>move(-1));$('right').addEventListener('click',()=>move(1));$('action').addEventListener('click',action);$('restart').addEventListener('click',()=>build());$('pause').addEventListener('click',()=>{paused=!paused;$('pause').textContent=paused?'▶ متابعة':'Ⅱ إيقاف';say(paused?'اللعبة متوقفة مؤقتًا':'رجعنا للعب!')});
window.addEventListener('keydown',e=>{if(['ArrowLeft','a','A'].includes(e.key))move(-1);if(['ArrowRight','d','D'].includes(e.key))move(1);if([' ','ArrowUp','w','W','Enter'].includes(e.key)){e.preventDefault();action()}if(e.key==='ArrowDown'&&mode==='snake')dir={x:0,z:1};if(e.key==='ArrowUp'&&mode==='snake')dir={x:0,z:-1}});
renderer=null;select('race');
</script></body></html>
