</style><main><header><div><h1>⚡ ALI GAMES — 3D WORLD</h1><p>10 ألعاب ثلاثية الأبعاد مستوحاة من صالة الألعاب المرفقة</p></div><button onclick="location.href='./'">الرئيسية</button></header><div class="layout"><aside class="panel"><h3>🎮 اختر اللعبة</h3><div class="games" id="games"></div></aside><section class="panel stage"><div id="hud"><span id="title">اختر لعبة</span><span id="score">النقاط: 0</span></div><div id="view"></div><div id="msg">اختر لعبة وابدأ المغامرة.</div><div class="actions"><button class="primary" id="start">ابدأ اللعب</button><button id="reset">إعادة اللعبة</button></div><div class="touch-hint" id="touchHint">👆 اسحب إصبعك يمينًا ويسارًا لتحريك السيارة</div></section></div></main>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script><script>
const $=x=>document.getElementById(x),names=[['racing','🏎️ سباق السيارات','تفادَ السيارات وقطع أطول مسافة'],['zombie','🧟 الهروب من الزومبي','اجمع المفاتيح واهرب من الزومبي'],['penalty','⚽ ضربات الجزاء','سدّد الكرة وتجاوز الحارس'],['basket','🏀 كرة السلة','سدّد الكرة داخل السلة'],['breakout','🧱 كسر الطوب 3D','اكسر جميع المكعبات بالكرة'],['snake','🐍 الثعبان 3D','اجمع الطعام وتجنب الاصطدام'],['xo','⭕ XO ثلاثية الأبعاد','العب ضد الكمبيوتر'],['mines','💣 كاسحة الألغام','اكشف المربعات دون لمس الألغام'],['castle','🏰 الدفاع عن القلعة','احمِ القلعة من موجات الأعداء'],['gold','🪙 جامع الذهب','اجمع العملات وتجنب القنابل']];
let renderer,scene,camera,root,mode='racing',running=false,score=0,t=0,player,objects=[],targets=[],keys={},clock=new THREE.Clock(),raf=0,aim=0,shots=0,turn='X',board=[],ended=false;
const mat=(c,r=.38,m=.1,e=0)=>new THREE.MeshStandardMaterial({color:c,roughness:r,metalness:m,emissive:e});
function mesh(geo,material,x,y,z,parent=root){let o=new THREE.Mesh(geo,material);o.position.set(x,y,z);o.castShadow=true;o.receiveShadow=true;parent.add(o);return o}
function box(x,y,z,a,b,c,color,parent=root){return mesh(new THREE.BoxGeometry(a,b,c),mat(color),x,y,z,parent)}
function ball(x,y,z,r,color,parent=root){return mesh(new THREE.SphereGeometry(r,24,18),mat(color),x,y,z,parent)}
function say(s){$('msg').textContent=s}function points(n){score+=n;$('score').textContent='النقاط: '+score}
function boom(x,y,z,color=0xffb52c){for(let i=0;i<12;i++){let p=ball(x,y,z,.07,color);p.userData.v=new THREE.Vector3((Math.random()-.5)*.2,Math.random()*.2,(Math.random()-.5)*.2);targets.push(p)}}
function base(){scene=new THREE.Scene();scene.background=new THREE.Color(0x101d33);scene.fog=new THREE.Fog(0x101d33,18,45);camera=new THREE.PerspectiveCamera(48,1,.1,100);camera.position.set(0,8,13);camera.lookAt(0,0,0);renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});renderer.setPixelRatio(Math.min(devicePixelRatio||1,2.5));renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;renderer.outputEncoding=THREE.sRGBEncoding;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.15;$('view').replaceChildren(renderer.domElement);scene.add(new THREE.HemisphereLight(0xcde7ff,0x283044,1.7));let sun=new THREE.DirectionalLight(0xffe8c5,2.6);sun.position.set(-7,12,8);sun.castShadow=true;sun.shadow.mapSize.set(4096,4096);sun.shadow.camera.near=1;sun.shadow.camera.far=45;sun.shadow.bias=-0.00015;scene.add(sun);let glow=new THREE.PointLight(0x398dff,20,30);glow.position.set(6,5,-5);scene.add(glow);root=new THREE.Group();scene.add(root);let floor=mesh(new THREE.PlaneGeometry(26,26),mat(0x254b3b,.95),0,-.3,0);floor.rotation.x=-Math.PI/2;let grid=new THREE.GridHelper(26,26,0x82aa9c,0x3a665b);grid.position.y=-.27;scene.add(grid);renderer.setSize($('view').clientWidth,$('view').clientHeight);camera.aspect=$('view').clientWidth/$('view').clientHeight;camera.updateProjectionMatrix();window.onresize=()=>{let w=$('view').clientWidth,h=$('view').clientHeight;renderer.setSize(w,h);camera.aspect=w/h;camera.updateProjectionMatrix()}}
function human(x,z,color=0x39a9e8){let g=new THREE.Group();ball(0,1.25,0,.25,0xe6bb96,g);box(0,.65,0,.55,.9,.35,color,g);box(-.17,.12,0,.18,.55,.2,0x202b40,g);box(.17,.12,0,.18,.55,.2,0x202b40,g);g.position.set(x,0,z);root.add(g);return g}
function setup(){cancelAnimationFrame(raf);if(renderer)renderer.dispose();objects=[];targets=[];keys={};score=0;t=0;shots=0;ended=false;running=false;$('score').textContent='النقاط: 0';base();player=null;
if(mode==='racing'){camera.position.set(0,10,14);camera.lookAt(0,0,-4);box(0,-.12,0,10,.22,34,0x252b36);box(-4.65,-.02,0,.32,.08,34,0xffd24a);box(4.65,-.02,0,.32,.08,34,0xffd24a);box(-1.33,.01,0,.055,.025,34,0xdce8f5);box(1.33,.01,0,.055,.025,34,0xdce8f5);for(let z=-14;z<17;z+=3.5){box(0,.02,z,.13,.035,1.55,0xffffff)}let car=new THREE.Group();mesh(new THREE.BoxGeometry(1.35,.48,2.35),mat(0xffb51f,.22,.62),0,.62,0,car);mesh(new THREE.BoxGeometry(.92,.48,1.05),mat(0x172b43,.16,.45),0,1.05,-.18,car);for(let x of [-.4,.4])mesh(new THREE.BoxGeometry(.28,.08,.12),mat(0xffffff,.18,.25),x,.67,-1.19,car);for(let x of [-.73,.73])for(let z of [-.72,.72]){let w=mesh(new THREE.CylinderGeometry(.24,.24,.16,24),mat(0x11151c,.85,.05),x,.38,z,car);w.rotation.z=Math.PI/2}car.position.set(0,0,7);root.add(car);player=car;for(let i=0;i<6;i++){let g=new THREE.Group();mesh(new THREE.BoxGeometry(1.12,.55,1.85),mat([0xff526e,0x35bce8,0x8b72f5][i%3],.24,.48),0,.58,0,g);mesh(new THREE.BoxGeometry(.78,.42,.82),mat(0x17283d,.18,.42),0,.99,-.12,g);for(let x of [-.58,.58])for(let z of [-.55,.55]){let w=mesh(new THREE.CylinderGeometry(.19,.19,.14,20),mat(0x101318),x,.3,z,g);w.rotation.z=Math.PI/2}g.position.set([-2.7,0,2.7][i%3],0,-i*5-5);root.add(g);objects.push(g)}say('اسحب إصبعك يمينًا ويسارًا لتحريك السيارة وتفادي السيارات الأخرى.')}
if(mode==='zombie'){camera.position.set(0,11,14);player=human(0,7);for(let i=0;i<5;i++){let z=human((Math.random()-.5)*9,-i*3-4,0x6eaa55);objects.push(z)}for(let i=0;i<5;i++){let k=ball((Math.random()-.5)*10,.35,-i*3, .25,0xffd343);targets.push(k)}say('اجمع المفاتيح الخمسة وابتعد عن الزومبي.')}
if(mode==='penalty'){camera.position.set(0,8,15);box(0,1,-8,8,2,.25,0xffffff);box(-4,1,-8,.2,2,.2,0xffffff);box(4,1,-8,.2,2,.2,0xffffff);player=ball(0,.35,5,.38,0xffffff);objects.push(box(0,1,-7,.9,1.7,.4,0xff8a28));say('اضغط جهة المرمى التي تريد التسديد إليها. لديك خمس ركلات.')}
if(mode==='basket'){camera.position.set(0,9,14);box(0,2.8,-7,2.8,2,.2,0xffffff);box(0,3,-6,.15,.15,.15,0xff5b2d);let hoop=mesh(new THREE.TorusGeometry(.7,.08,12,40),mat(0xff5c2d),0,2.2,-6);hoop.rotation.x=Math.PI/2;targets.push(hoop);player=ball(0,.4,6,.42,0xe87922);say('اضغط تسديد لإرسال الكرة نحو السلة.')}
if(mode==='breakout'){camera.position.set(0,11,13);box(0,0,0,13,.3,16,0x202c48);player=box(0,.5,6,2.2,.35,.55,0x31b7ff);let b=ball(0,.7,4,.27,0xffffff);targets.push(b);for(let z=-6;z<-2;z+=1.1)for(let x=-5;x<=5;x+=2){objects.push(box(x,.6,z,1.5,.75,.7,[0xff5570,0xffc837,0x3a9bff][Math.floor(Math.random()*3)]))}say('حرّك المضرب وأطلق الكرة.')}
if(mode==='snake'){camera.position.set(0,12,10);box(0,-.05,0,12,.15,12,0x182c48);let grid=new THREE.GridHelper(12,12,0x88aacc,0x39526e);grid.position.y=.04;scene.add(grid);player=human(0,0,0x37d59b);let food=ball(2,.35,1,.3,0xffc837);targets.push(food);say('اجمع الطعام وتحرك بالأسهم. لا تصطدم بنفسك أو بالحواف.')}
if(mode==='xo'){camera.position.set(0,10,10);box(0,0,0,7,.35,7,0x243b60);for(let x of [-1.15,1.15])box(x,.25,0,.12,.1,6,0x9bb5db);for(let z of [-1.15,1.15])box(0,.25,z,6,.1,.12,0x9bb5db);for(let i=0;i<9;i++){let x=(i%3-1)*2,z=(Math.floor(i/3)-1)*2;let tile=box(x,.35,z,1.7,.3,1.7,0x385782);tile.userData.i=i;targets.push(tile)}board=Array(9).fill('');say('اضغط على المربعات لوضع X والكمبيوتر يلعب O.')}
if(mode==='mines'){camera.position.set(0,12,10);box(0,-.05,0,12,.2,12,0x1c2942);let bombSet=new Set();while(bombSet.size<8)bombSet.add(Math.floor(Math.random()*36));for(let i=0;i<36;i++){let x=(i%6-2.5)*1.8,z=(Math.floor(i/6)-2.5)*1.8;let tile=box(x,.3,z,1.55,.55,1.55,0x5474aa);tile.userData={i,bomb:bombSet.has(i),open:false};targets.push(tile)}say('اضغط المربعات لكشفها وتجنب الألغام المخفية.')}
if(mode==='castle'){camera.position.set(0,12,14);box(0,.4,-7,5,1,2,0x8a97aa);for(let x of [-2.5,2.5])box(x,1.2,-7,1,2.5,2,0x69768f);player=human(0,6);say('اضغط على الشاشة لإطلاق السهام نحو الأعداء.')}
if(mode==='gold'){camera.position.set(0,12,12);player=human(0,6);for(let i=0;i<9;i++){let c=mesh(new THREE.CylinderGeometry(.28,.28,.1,24),mat(0xffc62e,.2,.8), (Math.random()-.5)*10,.5,(Math.random()-.5)*10);c.rotation.x=Math.PI/2;targets.push(c)}for(let i=0;i<4;i++)objects.push(ball((Math.random()-.5)*10,.5,(Math.random()-.5)*10,.45,0x20212b))}
camera.lookAt(0,0,0);clock=new THREE.Clock();draw()}
function draw(){raf=requestAnimationFrame(draw);let dt=Math.min(clock.getDelta(),.04);if(running&&!ended){t+=dt;if(mode==='racing'){player.position.x=clamp(player.position.x+((keys.right?1:0)-(keys.left?1:0))*7*dt,-3,3);objects.forEach(o=>{o.position.z+=9*dt;if(o.position.z>9){o.position.z=-22-Math.random()*8;o.position.x=[-2,0,2][Math.random()*3|0]}if(Math.abs(o.position.z-player.position.z)<1.5&&Math.abs(o.position.x-player.position.x)<1.1)finish('اصطدمت! انتهى السباق.');});if(Math.floor(t*8)>score)points(1)}
if(mode==='zombie'||mode==='gold'||mode==='castle'){player.position.x=clamp(player.position.x+((keys.right?1:0)-(keys.left?1:0))*6*dt,-5,5);player.position.z=clamp(player.position.z+((keys.down?1:0)-(keys.up?1:0))*6*dt,-9,9);player.rotation.y=Math.atan2(keys.right?1:keys.left?-1:0,keys.up?-1:keys.down?1:0);if(mode==='zombie'){objects.forEach(z=>{let v=player.position.clone().sub(z.position);v.y=0;if(v.length())z.position.add(v.normalize().multiplyScalar(1.2*dt));if(v.length()<.8)finish('أمسك بك الزومبي!')});targets.forEach(k=>{if(k.visible&&k.position.distanceTo(player.position)<.8){k.visible=false;points(10)}});if(targets.every(k=>!k.visible))finish('نجوت وجمعت المفاتيح!')}if(mode==='gold'){targets.forEach(c=>{c.rotation.y+=dt*2;if(c.visible&&c.position.distanceTo(player.position)<.8){c.visible=false;points(5);boom(c.position.x,.6,c.position.z)}});objects.forEach(b=>{b.position.x+=Math.sin(t*2)*dt;if(b.position.distanceTo(player.position)<.8)finish('اصطدمت بالقنبلة!')})}}
if(mode==='breakout'){let b=targets[0];b.position.x+=Math.sin(t*2)*dt*4;b.position.z+=dt*5;if(b.position.z>7){b.position.z=4;points(1)}player.position.x=clamp(player.position.x+((keys.right?1:0)-(keys.left?1:0))*8*dt,-5,5);objects.forEach(o=>{if(o.visible&&b.position.distanceTo(o.position)<1){o.visible=false;b.position.z=-7;points(10);boom(o.position.x,.7,o.position.z)}});if(objects.every(o=>!o.visible))finish('كسرت كل الطوب!')}
if(mode==='snake'){player.position.x=clamp(player.position.x+((keys.right?1:0)-(keys.left?1:0))*5*dt,-5,5);player.position.z=clamp(player.position.z+((keys.down?1:0)-(keys.up?1:0))*5*dt,-5,5);let f=targets[0];if(f.position.distanceTo(player.position)<.8){points(10);f.position.set((Math.random()-.5)*9,.3,(Math.random()-.5)*9)}}
if(mode==='penalty'&&player){player.position.x+=Math.sin(t*3)*dt*2;if(t>1.1){t=0;shots++;if(Math.random()>.35)points(10);player.position.set(0,.35,5);if(shots>=5)finish('انتهت الركلات!')}}
if(mode==='basket'&&t>1.5){t=0;points(2);targets[0].rotation.z+=.1}
if(mode==='castle'){if(Math.random()<dt*.35){let e=ball((Math.random()-.5)*10,.6,-10, .4,0xff536c);objects.push(e)}objects.forEach(e=>{e.position.z+=dt*1.5;if(e.position.z>5)finish('وصل الأعداء إلى القلعة!');if(e.position.distanceTo(player.position)<1.2){e.visible=false;points(5)}})}
}
renderer.render(scene,camera)}
function finish(s){if(ended)return;ended=true;running=false;say(s+' — النتيجة '+score);$('start').textContent='العب مجدداً'}
function select(id){mode=id;document.querySelectorAll('.game').forEach(b=>b.classList.toggle('active',b.dataset.id===id));$('title').textContent=names.find(x=>x[0]===id)[1];$('start').textContent='ابدأ اللعب';setup()}
names.forEach(n=>{let b=document.createElement('button');b.className='game';b.dataset.id=n[0];b.textContent=n[1];b.onclick=()=>select(n[0]);$('games').append(b)});
function begin(){if(ended){setup();running=true}else running=true;say(mode==='racing'?'بدأ السباق! اسحب إصبعك يمينًا ويسارًا للتحكم.':'بدأت اللعبة! استخدم اللمس للتحكم.')}
function key(k){keys[k]=true;setTimeout(()=>keys[k]=false,180)}
window.addEventListener('keydown',e=>{if(e.key.includes('Arrow'))e.preventDefault();if(e.key==='ArrowLeft'||e.key==='a')key('left');if(e.key==='ArrowRight'||e.key==='d')key('right');if(e.key==='ArrowUp'||e.key==='w')key('up');if(e.key==='ArrowDown'||e.key==='s')key('down');if(e.key===' '){begin()}});
let swipeStart=null,touchSteering=false;
$('view').addEventListener('pointerdown',e=>{swipeStart={x:e.clientX,y:e.clientY};touchSteering=true;if($('view').setPointerCapture)$('view').setPointerCapture(e.pointerId);if(mode==='racing'&&running){const r=$('view').getBoundingClientRect();player.position.x=clamp(((e.clientX-r.left)/r.width-.5)*6,-3,3)}});
$('view').addEventListener('pointermove',e=>{if(!touchSteering||!swipeStart)return;if(mode==='racing'&&running){const r=$('view').getBoundingClientRect();player.position.x=clamp(((e.clientX-r.left)/r.width-.5)*6,-3,3)}});
$('view').addEventListener('pointerup',e=>{if(!swipeStart)return;const dx=e.clientX-swipeStart.x,dy=e.clientY-swipeStart.y;if(mode!=='racing'&&running&&Math.max(Math.abs(dx),Math.abs(dy))>24){keys.left=dx<-18;keys.right=dx>18;keys.up=dy<-18;keys.down=dy>18;setTimeout(()=>{keys={}},240)}swipeStart=null;touchSteering=false});
$('view').addEventListener('pointercancel',()=>{swipeStart=null;touchSteering=false;keys={}});
$('view').addEventListener('pointerdown',e=>{if(mode==='penalty'&&running){points(Math.random()>.3?10:0);shots++;if(shots>=5)finish('انتهت الركلات!')}if(mode==='basket'&&running){points(2);boom(0,2,-6,0xffa52d)}if(mode==='xo'&&running){const r=$('view').getBoundingClientRect(),x=(e.clientX-r.left)/r.width,y=(e.clientY-r.top)/r.height;let i=Math.floor(y*3)*3+Math.floor(x*3);if(i>=0&&i<9&&!board[i]){board[i]='X';targets[i].material.color.set(0xffd13b);let free=board.map((v,j)=>v?null:j).filter(v=>v!==null);if(free.length){let j=free[Math.random()*free.length|0];board[j]='O';targets[j].material.color.set(0xff5570)}if(board.every(Boolean))finish('انتهت جولة XO!')}}if(mode==='mines'&&running){let o=targets[0];let idx=Math.floor(Math.random()*targets.length);o=targets[idx];if(o.userData.bomb)finish('انفجر لغم!');else if(!o.userData.open){o.userData.open=true;o.material.color.set(0x36a778);points(1)}}if(mode==='castle'&&running){let e=objects.find(o=>o.position.z<0);if(e){e.visible=false;points(5);boom(e.position.x,1,e.position.z)}}});
$('start').onclick=begin;$('reset').onclick=()=>select(mode);select('racing');
</script></html>
