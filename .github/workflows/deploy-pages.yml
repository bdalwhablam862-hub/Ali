name: Deploy Ali Games to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validate 3D arcade JavaScript
        shell: bash
        run: |
          python3 - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path

          class InlineScripts(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.current = None
                  self.scripts = []

              def handle_starttag(self, tag, attrs):
                  if tag == "script" and not dict(attrs).get("src"):
                      self.current = []

              def handle_data(self, data):
                  if self.current is not None:
                      self.current.append(data)

              def handle_endtag(self, tag):
                  if tag == "script" and self.current is not None:
                      self.scripts.append("".join(self.current))
                      self.current = None

          html = Path("3d-arcade.html").read_text(encoding="utf-8")
          parser = InlineScripts()
          parser.feed(html)
          assert parser.scripts, "No inline game script found"
          code = "\n".join(parser.scripts)
          required = ["THREE.WebGLRenderer", "pointermove", "deltaX*8", "for(let tunnelZ=-25"]
          missing = [item for item in required if item not in code]
          assert not missing, f"Missing expected 3D/mobile features: {missing}"
          Path("/tmp/3d-arcade-inline.js").write_text(code, encoding="utf-8")
          print(f"Extracted {len(code)} characters of inline JavaScript")
          PY
          node --check /tmp/3d-arcade-inline.js
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
